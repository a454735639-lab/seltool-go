<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · selenium-tool</title><link rel="stylesheet" href="/auth.css"></head>
<body>
  <main class="auth-card">
    <div class="brand"><div class="brand-icon">⌁</div><div><div class="brand-name">selenium-tool</div><div class="brand-subtitle">目标站点自动化管理</div></div></div>
    <div id="loading" class="loading">正在检查账户状态…</div>
    <section id="content" hidden><h1>登录</h1><p class="intro">登录后才能查看和修改目标站点配置。</p><form id="login-form"><label for="username">用户名</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">登录</button><div id="message" class="message"></div></form></section>
  </main>
  <script>
    let authStatus;
    const loading=document.getElementById('loading'),content=document.getElementById('content'),form=document.getElementById('login-form'),message=document.getElementById('message'),submit=document.getElementById('submit');
    function showMessage(text,type='error'){message.textContent=text;message.className='message '+type}
    async function init(){try{const response=await fetch('/api/auth/status'),status=await response.json();if(!status.registered){location.replace('/register.html');return}if(status.authenticated){location.replace('/');return}authStatus=status;loading.hidden=true;content.hidden=false}catch(e){loading.textContent='账户状态加载失败：'+e.message}}
    form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;showMessage('');try{const body=new URLSearchParams({username:form.username.value.trim(),password:form.password.value}),response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',[authStatus.csrfHeaderName]:authStatus.csrfToken},body}),data=await response.json();if(!response.ok)throw Error(data.error||'登录失败');location.replace('/')}catch(e){showMessage(e.message)}finally{submit.disabled=false}});
    init();
  </script>
</body></html>
