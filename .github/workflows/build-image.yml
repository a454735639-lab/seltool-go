name: build-multiarch

# 在 GitHub 上构建 amd64 + arm64 双架构镜像，推到 GitHub Container Registry。
#
# 和 Gitea 那条流水线的区别：
#   - Gitea：用 NAS 上的本地基础镜像 seltool-go:runtime-slim2，只出 arm64
#   - GitHub：用 deploy/Dockerfile.multiarch 从 debian:bookworm-slim 自包含构建，
#     一次出 amd64 + arm64 两个架构
#
# 产物：ghcr.io/<owner>/<repo>:latest / :sha-<short>

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算标签
        id: meta
        run: |
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo "| 镜像 | \`${{ env.IMAGE }}\` |"
            echo "| 标签 | \`latest\` / \`sha-${{ steps.meta.outputs.short }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
