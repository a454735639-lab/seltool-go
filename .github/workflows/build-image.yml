name: build-multiarch

# 构建 amd64 + arm64 双架构镜像：
#   1) 推到 GitHub Container Registry（ghcr.io）
#   2) 另外导出两个架构的离线 tar.gz，挂到 Release 上
#
# 产物：
#   ghcr.io/<owner>/<repo>:latest / :sha-<short> / :<日期>-<short>
#   Release: build-<日期>-<short>  附件 seltool-go-amd64.tar.gz / seltool-go-arm64.tar.gz

on:
  push:
    branches: [master]
    # 只改文档不重建镜像（多架构构建要 20 分钟，不值得）
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/a454735639-lab/seltoolgo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release、上传附件
      packages: write   # 推送 ghcr

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算标签
        id: meta
        run: |
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          DATE="$(date +%Y%m%d)"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "release_tag=build-$DATE-$SHORT" >> "$GITHUB_OUTPUT"

      # ① 多架构清单推到 ghcr（不落本地，直接推）
      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:sha-${{ steps.meta.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ② 单独导两个架构的离线包（复用上面的层缓存，很快）
      - name: 导出 amd64 离线包
        run: |
          set -eu
          docker buildx build \
            --platform linux/amd64 \
            -f deploy/Dockerfile.multiarch \
            --output type=docker \
            -t seltool-go:amd64 \
            --cache-from type=gha \
            .
          docker save seltool-go:amd64 | gzip -9 > seltool-go-amd64.tar.gz
          ls -lh seltool-go-amd64.tar.gz

      - name: 冒烟测试（amd64）
        run: |
          set -eu
          NAME="st-smoke-$$"
          docker run -d --name "$NAME" -p 18081:8080 seltool-go:amd64 >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:18081/login.html; then
              echo "第 $i 次：控制台就绪"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "冒烟失败，容器日志："
            docker logs --tail 30 "$NAME"
            exit 1
          fi
          # noVNC 静态文件是否在（缺了会 404）
          code="$(docker exec "$NAME" bash -c 'exec 3<>/dev/tcp/127.0.0.1/7900 && printf "GET /vnc.html HTTP/1.0\r\n\r\n" >&3 && head -1 <&3' 2>/dev/null || true)"
          case "$code" in
            *200*) echo "noVNC 就绪：$code" ;;
            *) echo "noVNC 异常：${code:-<空>}"; exit 1 ;;
          esac

      - name: 导出 arm64 离线包
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/Dockerfile.multiarch \
            --output type=docker \
            -t seltool-go:arm64 \
            --cache-from type=gha \
            .
          docker save seltool-go:arm64 | gzip -9 > seltool-go-arm64.tar.gz
          ls -lh seltool-go-arm64.tar.gz

      # ③ 挂到 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          files: |
            seltool-go-amd64.tar.gz
            seltool-go-arm64.tar.gz
          body: |
            ## seltool-go ${{ steps.meta.outputs.release_tag }}

            提交：`${{ github.sha }}`

            ### 在线拉取（推荐）

            ```sh
            docker pull ${{ env.IMAGE }}:latest
            ```

            多架构清单，Docker 会按本机架构自动选择。

            ### 离线导入

            ```sh
            # x86_64 / Intel / AMD
            docker load < seltool-go-amd64.tar.gz

            # ARM64 / 树莓派 / Apple Silicon / 群晖 ARM 机型
            docker load < seltool-go-arm64.tar.gz
            ```

            导入后镜像名是 `seltool-go:amd64` 或 `seltool-go:arm64`，按需重命名：

            ```sh
            docker tag seltool-go:amd64 seltool-go:local
            ```

            ### 部署

            见 [README](https://github.com/${{ github.repository }}#快速开始)。

      - name: 输出摘要
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo "| 镜像 | \`${{ env.IMAGE }}\` |"
            echo "| 标签 | \`latest\` / \`sha-${{ steps.meta.outputs.short }}\` |"
            echo "| Release | \`${{ steps.meta.outputs.release_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
