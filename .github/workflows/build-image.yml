name: build-multiarch

# 构建 amd64 + arm64 双架构镜像：
#   1) 先跑 go vet / go test（单元测试不过就不该产出镜像）
#   2) 先在本地构建 amd64 并冒烟（接口/静态页/noVNC 都要通），过了才推送
#   3) 推到 GHCR + Docker Hub
#   4) 导出两个架构的离线 tar.gz，挂到 Release
#
# 产物：
#   ghcr.io/<owner>/<repo>:<版本> / :latest / :sha-<short> / :<日期>-<short>
#   Docker Hub <user>/seltool-go:同上
#   Release: v<版本>  附件 seltool-go-amd64.tar.gz / seltool-go-arm64.tar.gz
#
# 顺序很重要：v1.0.3 之前是「先推送后冒烟」，冒烟挂了坏镜像已经在仓库里了。

on:
  push:
    branches: [master]
    # 只改文档不重建镜像（多架构构建要 20 分钟，不值得）
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/a454735639-lab/seltoolgo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 Release、上传附件
      packages: write   # 推送 ghcr

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 单元测试
        run: |
          set -eu
          go version
          go vet ./...
          go test ./...

      - name: 计算标签
        id: meta
        run: |
          set -eu
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          DATE="$(date +%Y%m%d)"
          # 版本号必须显式存在且合法：以前是 `|| echo 0.0.0`，VERSION 丢了
          # 会静默推出一版叫 0.0.0 的镜像，谁都发现不了
          VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION 文件缺失或格式非法（读到 '${VERSION}'），应为 x.y.z"
            exit 1
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$VERSION（Release 标签 v$VERSION）"

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3

      - name: 配置 Buildx
        uses: docker/setup-buildx-action@v3

      # ① 先只构建 amd64 到本地，用于冒烟
      - name: 构建 amd64（本地，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          platforms: linux/amd64
          load: true
          push: false
          tags: seltool-go:amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ② 冒烟：过了才允许推送
      - name: 冒烟测试（amd64）
        run: |
          set -eu
          NAME="st-smoke-$$"
          docker run -d --name "$NAME" -p 18081:8080 seltool-go:amd64 >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null --max-time 3 http://127.0.0.1:18081/login.html; then
              echo "第 $i 次：控制台就绪"; ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "冒烟失败，容器日志："
            docker logs --tail 40 "$NAME"
            exit 1
          fi

          # /healthz 是 compose healthcheck 依赖的探针
          curl -fsS --max-time 3 http://127.0.0.1:18081/healthz | grep -q '"ok":true'
          echo "healthz 正常"

          # 快捷页旧接口：不带令牌必须 403（v1.0.4 起 ?k= 不再直接放行）
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 'http://127.0.0.1:18081/api/pt-panel/summary?k=whatever')"
          if [ "$code" != "403" ]; then
            echo "快捷页鉴权异常：期望 403，实际 $code"; exit 1
          fi
          echo "快捷页鉴权正常（无令牌 403）"

          # noVNC 静态文件是否在（缺了会 404）
          code="$(docker exec "$NAME" bash -c 'exec 3<>/dev/tcp/127.0.0.1/7900 && printf "GET /vnc.html HTTP/1.0\r\n\r\n" >&3 && head -1 <&3' 2>/dev/null || true)"
          case "$code" in
            *200*) echo "noVNC 就绪：$code" ;;
            *) echo "noVNC 异常：${code:-<空>}"; exit 1 ;;
          esac

      # ③ 冒烟通过后才登录仓库并推送
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 推送多架构（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:sha-${{ steps.meta.outputs.short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ④ 离线包：amd64 直接用冒烟时构建的本地镜像
      - name: 导出 amd64 离线包
        run: |
          set -eu
          docker save seltool-go:amd64 | gzip -9 > seltool-go-amd64.tar.gz
          ls -lh seltool-go-amd64.tar.gz

      - name: 导出 arm64 离线包
        run: |
          set -eu
          docker buildx build \
            --platform linux/arm64 \
            -f deploy/Dockerfile.multiarch \
            --output type=docker \
            -t seltool-go:arm64 \
            --cache-from type=gha \
            .
          docker save seltool-go:arm64 | gzip -9 > seltool-go-arm64.tar.gz
          ls -lh seltool-go-arm64.tar.gz

      # ⑤ 挂到 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          files: |
            seltool-go-amd64.tar.gz
            seltool-go-arm64.tar.gz
          body: |
            ## seltool-go ${{ steps.meta.outputs.version }}

            提交：`${{ github.sha }}`

            ### 在线拉取（推荐）

            ```sh
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            # 或
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/seltool-go:${{ steps.meta.outputs.version }}
            ```

            多架构清单，Docker 会按本机架构自动选择。

            ### 离线导入

            ```sh
            # x86_64 / Intel / AMD
            docker load < seltool-go-amd64.tar.gz

            # ARM64 / 树莓派 / Apple Silicon / 群晖 ARM 机型
            docker load < seltool-go-arm64.tar.gz
            ```

            导入后镜像名是 `seltool-go:amd64` 或 `seltool-go:arm64`，按需重命名：

            ```sh
            docker tag seltool-go:amd64 seltool-go:local
            ```

            ### 部署

            见 [README](https://github.com/${{ github.repository }}#快速开始)。

      - name: 输出摘要
        run: |
          {
            echo "### 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`${{ steps.meta.outputs.version }}\` |"
            echo "| 架构 | linux/amd64, linux/arm64 |"
            echo "| 镜像 | \`${{ env.IMAGE }}\` |"
            echo "| 标签 | \`latest\` / \`sha-${{ steps.meta.outputs.short }}\` |"
            echo "| Release | \`${{ steps.meta.outputs.release_tag }}\` |"
            echo "| 冒烟 | amd64 已通过（healthz / 快捷页鉴权 / noVNC） |"
          } >> "$GITHUB_STEP_SUMMARY"
