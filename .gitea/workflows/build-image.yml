# ==========================================================================
# seltool-go · push 时自动构建 arm64 镜像并推送到 Gitea Registry
#
# 运行位置：NAS 上的 act_runner（容器 act_runner，标签 ubuntu-latest）
# 触发：push 到 master，或手动 workflow_dispatch
# 产物：10.0.0.1:3003/gitadmin/seltool-go:<日期-sha> / :latest / :sha-<short>
#
# 关键点（都是实际踩过的）：
#   1. 容器内必须清空代理变量 —— NAS 的 Docker daemon 会注入 HTTP_PROXY，
#      访问内网 Gitea 会被 Clash 转走返回 502。
#   2. 基础镜像必须预先存在 —— Docker Hub 直连会走 IPv6 超时，所以先 pull 再 --pull=false。
#   3. act_runner 不预置仓库内容，且本 Gitea 未镜像 actions/checkout，
#      所以用 git clone + REPO_READ_TOKEN 检出。
#   4. seltool-go:runtime-slim2 是宿主机本地镜像，不在 registry 里。
#      job 容器共享宿主 daemon，FROM 能引用到；丢了用 sh scripts/build.sh --base 重建。
#   5. 容器内监听 8080（生产 compose 映射 8081:8080），且镜像里没有 wget/curl，
#      所以冒烟测试从宿主机 curl 探测映射端口。
# ==========================================================================
name: build-image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: 10.0.0.1:3003
  IMAGE: 10.0.0.1:3003/gitadmin/seltool-go
  GITEA_HOST: gitea:3000
  REPO: gitadmin/seltool-go
  RUNTIME_IMAGE: seltool-go:runtime-slim2
  # 容器内不走代理（daemon 注入的代理会让内网地址 502）
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  NO_PROXY: "*"

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 环境自检
        run: |
          set -eux
          uname -m
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          git --version
          if ! docker image inspect "$RUNTIME_IMAGE" >/dev/null 2>&1; then
            echo "基础镜像 $RUNTIME_IMAGE 不存在"
            echo "在 NAS 上执行：sh scripts/build.sh --base"
            exit 1
          fi
          echo "基础镜像就绪：$(docker images --format '{{.Size}}' "$RUNTIME_IMAGE" | head -1)"

      - name: 2. 检出源码
        env:
          REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}
        run: |
          set -eu
          SRC=/tmp/st-src
          rm -rf "$SRC"
          git clone --depth 1 "http://gitadmin:${REPO_READ_TOKEN}@${GITEA_HOST}/${REPO}.git" "$SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"
          echo "commit=$(cd "$SRC" && git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "提交：$(cd "$SRC" && git log --oneline -1)"

      - name: 3. 计算版本号
        run: |
          set -eu
          SHORT="$(echo "$commit" | cut -c1-7)"
          VERSION="$(date +%Y%m%d)-${SHORT}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$SHORT" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION"

      - name: 4. 预拉构建镜像
        run: |
          set -eu
          for img in golang:1.26-alpine; do
            echo "--- 拉取 $img ---"
            ok=0
            for attempt in 1 2 3; do
              if docker pull "$img"; then ok=1; break; fi
              echo "  第 $attempt 次失败，重试..."; sleep 5
            done
            [ "$ok" = 1 ] || { echo "拉取 $img 失败"; exit 1; }
          done

      - name: 5. 构建镜像
        run: |
          set -eu
          cd "$SRC"
          docker build --pull=false \
            -f deploy/Dockerfile.ci \
            --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$SHORT_SHA" \
            -t "seltool-go:ci" \
            .
          docker image ls --filter "reference=$IMAGE"

      - name: 6. 结构校验
        run: |
          set -eu
          docker image inspect "$IMAGE:$VERSION" --format '  arch={{.Architecture}}/{{.Os}}'
          arch="$(docker image inspect "$IMAGE:$VERSION" --format '{{.Architecture}}')"
          [ "$arch" = "arm64" ] || { echo "架构不是 arm64：$arch"; exit 1; }
          docker run --rm --entrypoint sh "$IMAGE:$VERSION" -c '
            test -x /app/seltool && echo "  ok /app/seltool"
            test -x /app/vncproxy && echo "  ok /app/vncproxy"
            test -x /app/entrypoint.sh && echo "  ok /app/entrypoint.sh"
            test -x /usr/lib/chromium/chromium && echo "  ok chromium"
            test -x /usr/bin/Xvfb && echo "  ok Xvfb"
            test -x /usr/bin/x11vnc && echo "  ok x11vnc"
          '

      - name: 7. 冒烟运行
        run: |
          set -eu
          # 只验两件事：容器起得来、控制台回 200。
          # 不用 /proc/net/tcp 查监听 —— 实测 8080 在 IPv6 栈（tcp6），
          # 查 tcp 得 0 条匹配，但 HTTP 请求正常。
          # 也不能在 job 容器里 curl 127.0.0.1:<映射端口> ——
          # 那是 job 自己的回环，访问不到被测容器。
          NAME="st-smoke-$$"
          docker run -d --name "$NAME" -p 18081:8080 "$IMAGE:$VERSION" >/dev/null
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT

          ok=0
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Status}}' "$NAME" 2>/dev/null || echo unknown)"
            if [ "$status" != "running" ]; then
              echo "第 $i 次：容器状态 $status"
              docker logs --tail 30 "$NAME"
              exit 1
            fi
            code="$(docker exec "$NAME" bash -c '
              exec 3<>/dev/tcp/127.0.0.1/8080 2>/dev/null || exit 1
              printf "GET /login.html HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3
              head -1 <&3
            ' 2>/dev/null || true)"
            case "$code" in
              *200*)
                echo "第 $i 次：HTTP 就绪 → $code"
                ok=1
                break
                ;;
            esac
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "冒烟失败：控制台未在 60 秒内就绪"
            docker logs --tail 30 "$NAME"
            exit 1
          fi
          echo "冒烟通过"

      - name: 8. 推送 Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu
          echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u gitadmin --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT_SHA"
          docker logout "$REGISTRY"
          echo "已推送：$IMAGE:$VERSION / :latest / :sha-$SHORT_SHA"
